name: Screenshot and smoke test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm i
          npm run prepare:playwright

      - name: Start static server
        run: |
          nohup python3 -m http.server 8000 -b 127.0.0.1 >/dev/null 2>&1 &

      - name: Generate screenshots (dark/light)
        env:
          URL: http://127.0.0.1:8000/index.html
          OUT_DIR: artifacts
        run: npm run screenshot

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/*.png
